# Mobayilo design-system monorepo. Each package is independently versioned and
# published, but shares tooling and standards (see the frontend-system-design /
# micro-frontends-and-design-systems modules in academy-mobayilo).
packages:
  - "telegram-connect"
  - "themes"
  - "auth-magic-link"
  - "mailpit"
  - "ui"
  - "site"

# pnpm 11 treats an *ignored* build script as fatal in its pre-run deps check,
# so every detected build must get an explicit true/false here.
allowBuilds:
  esbuild: true
  # sharp's script only verifies the prebuilt @img/sharp-* binary, or compiles
  # from source (and fails) when it finds a system libvips such as Homebrew vips.
  # The prebuilt binary works without it.
  sharp: false
  # workerd is wrangler's local Workers runtime (needed for `wrangler dev`;
  # `wrangler pages deploy` works without it, but approve it so installs are quiet).
  workerd: true
